[project]
name = "requester"
version = "0.1.0"
description = "Django job-offer and worker matching platform"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "NoobforAl", email = "58856931+NoobforAl@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "django==5.1",
    "django-extensions==3.2.3",
    "djangorestframework==3.15.2",
    "django-filter==24.2",
    "markdown==3.6",
    "gunicorn==23.0.0",
    "mysqlclient==2.2.4",
    "redis==5.0.8",
    "django-elasticsearch-dsl==8.0",
    "celery==5.4.0",
    "langchain==0.3.12",
    "langchain-ollama==0.2.1",
    "jdatetime==5.0.0",
    "weasyprint==63.1",
    "pdfplumber==0.11.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "autopep8==2.3.1",
    "flake8==7.1.1",
    "djlint==1.36.3",
    # Linting / formatting
    "ruff>=0.8",
    # Static type & data checking
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "types-requests",
    "types-Markdown",
    "types-PyYAML",
    # Security & code-quality checks
    "bandit>=1.8",
    "vulture>=2.13",
    "pip-audit>=2.7",
]
# Needs the native Graphviz headers (graphviz-dev); install with `uv sync --group diagram`.
diagram = [
    "pygraphviz==1.14",
]

[tool.uv]
# This is a Django application, not an installable package.
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "DJ",       # flake8-django
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PL",       # pylint
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "requester.settings"

[tool.bandit]
exclude_dirs = ["src/**/migrations", ".venv"]

[tool.vulture]
paths = ["src"]
exclude = ["migrations/"]
min_confidence = 80
