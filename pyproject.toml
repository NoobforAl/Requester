[project]
name = "requester"
version = "0.1.0"
description = "Django job-offer and worker matching platform"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "NoobforAl", email = "58856931+NoobforAl@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "django>=6.1,<6.2",
    "django-extensions>=4.1",
    "django-elasticsearch-dsl>=8.0,<9",  # client 8 matches the Elasticsearch 8.15 server in compose
    "celery>=5.5",
    "redis>=6.0",
    "httpx>=0.27",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "mysqlclient>=2.2",
    "langchain-ollama>=1.0",
    "jdatetime>=5.0",
    "weasyprint>=66",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "autopep8>=2.3",
    "flake8>=7.1",
    "djlint>=1.36",
    # Linting / formatting
    "ruff>=0.8",
    # Static type & data checking
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "types-requests",
    "types-PyYAML",
    # Security & code-quality checks
    "bandit>=1.8",
    "vulture>=2.13",
    "pip-audit>=2.7",
]
# Needs the native Graphviz headers (graphviz-dev); install with `uv sync --group diagram`.
diagram = [
    "pygraphviz>=1.14",
]

[tool.uv]
# This is a Django application, not an installable package.
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "DJ",       # flake8-django
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PL",       # pylint
    "RUF",      # ruff-specific
]

# Persian text trips the "ambiguous unicode" rules (false positives); Django's
# declarative `class Meta` / widgets dicts trip RUF012.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101", "PLR2004"]
"**/test_*.py" = ["S101", "PLR2004"]
"**/conftest.py" = ["S101", "S106"]
"**/manage.py" = ["PLC0415"]
# Seed commands create throw-away demo accounts and random demo data.
"**/management/commands/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "requester.settings_test"

[tool.bandit]
exclude_dirs = ["src/**/migrations", ".venv"]

[tool.vulture]
paths = ["src"]
exclude = ["migrations/"]
min_confidence = 80
# pytest fixture arguments, Django command/signature parameters
ignore_names = ["db", "options", "filename", "args", "kwargs", "sender"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "requester.settings_test"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore:No directory at.*staticfiles:UserWarning",
]
