{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="درخواستی؛ جایی برای پیدا کردن شغل و استخدام">
        <title>{% block title %}درخواستی{% endblock title %}</title>
        <link rel="preload"
              href="{% static 'fonts/Vazirmatn-variable.woff2' %}"
              as="font"
              type="font/woff2"
              crossorigin>
        <link rel="stylesheet" href="{% static 'css/app.css' %}">
    </head>
    <body data-portal="{% block portal %}{% endblock portal %}">
        <a class="skip-link" href="#main">رفتن به محتوای صفحه</a>
        {% block header %}{% endblock header %}
        {% if messages %}
            <div class="flash-region">
                {% for message in messages %}
                    <div class="flash flash--{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}"
                         role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        <main id="main">
            {% block content %}{% endblock content %}
        </main>
        <footer class="site-footer">© {% now "Y" %} درخواستی</footer>
        <script src="{% static 'js/app.js' %}" defer></script>
    </body>
</html>
