# Prometheus scrape config for the Requester monitoring stack
# (docker-compose.monitoring.yaml). All targets are compose service names.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    project: requester

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Django (django-prometheus). /metrics answers 404 unless the request carries
  # "Authorization: Bearer $METRICS_TOKEN". The token is read from a file that
  # compose mounts as a secret (secrets.metrics_token, environment: METRICS_TOKEN),
  # so it never appears in this file or in the Prometheus UI.
  - job_name: django
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["web:8000"]
        labels:
          service: web

  - job_name: mysqld
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          service: db

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: cache

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels:
          service: tasks
