# Loads every dashboard JSON from the mounted monitoring/grafana/dashboards dir.
apiVersion: 1

providers:
  - name: requester
    orgId: 1
    folder: Requester
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
