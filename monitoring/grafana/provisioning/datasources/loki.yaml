# Loki datasource. The trace_id derived field links a log line to its trace in
# the Jaeger datasource (uid "jaeger", provisioned in jaeger.yaml).
# "$$" escapes "$" in Grafana provisioning files.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace in Jaeger
