# Development overrides: `make docker-up` uses this together with docker-compose.yaml.
# DEBUG on, Django dev server, mock data and a known admin login (admin / admin).
# Never use this file for a real deployment.
x-dev-env: &dev-env
    DJANGO_DEBUG: "true"
    SECRET_KEY: "dev-only-change-me"
    ALLOWED_HOSTS: "*"
    DJANGO_SUPERUSER_USERNAME: "admin"
    DJANGO_SUPERUSER_PASSWORD: "admin"
    APP_ENVIRONMENT: "development"

# The dev image also installs the dev dependency group (Faker for `seed_fake_data`).
x-dev-build: &dev-build
    args:
        UV_SYNC_ARGS: "--dev"

services:
    web:
        build: *dev-build
        # deploy-dev seeds the demo accounts and Faker volume data (see Makefile).
        command: ["make", "RUN=", "deploy-dev"]
        environment: *dev-env
    tasks:
        build: *dev-build
        environment: *dev-env
    scheduler:
        build: *dev-build
        environment: *dev-env
