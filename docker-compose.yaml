# Service names say what each container is for:
#   web        Django (gunicorn)             tasks      Celery worker (AI summaries, reports, e-mails)
#   scheduler  Celery beat (job alerts)      db         MariaDB
#   cache      Redis (cache + Celery broker) mailhog    catches outgoing mail
#
# Elasticsearch, Logstash and Kibana (analytics) are in docker-compose.analytics.yaml:
# the app itself does not need them (`make analytics-up`, docs/analytics.md).
#
# Secrets and per-machine settings come from a `.env` file next to this one
# (see .env.example); nothing secret is written in this file.

x-app-env: &app-env
    ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
    SECRET_KEY: "${SECRET_KEY:-}" # required: Django refuses to start without it when DEBUG is off
    DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
    SITE_URL: "${SITE_URL:-http://localhost:8000}"
    DB_HOST: "db"
    DB_PORT: 3306
    DB_USER: "${DB_USER:-requester}"
    DB_PASSWORD: "${DB_PASSWORD:-requester-dev-password}"
    DB_NAME: "${DB_NAME:-requester}"
    REDIS_URL: "redis://:${REDIS_PASSWORD:-requester-dev-redis}@cache:6379/1"
    EMAIL_HOST: "mailhog"
    EMAIL_PORT: 1025
    EMAIL_HOST_USER: ""
    EMAIL_HOST_PASSWORD: ""
    EMAIL_USE_TLS: False
    CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-requester-dev-redis}@cache:6379/1"
    CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-requester-dev-redis}@cache:6379/1"
    CELERY_ACCEPT_CONTENT: '["json"]'
    CELERY_TASK_SERIALIZER: "json"
    CELERY_RESULT_SERIALIZER: "json"
    CELERY_TIMEZONE: "UTC"
    # AI resume summaries: on when OPENROUTER_API_KEY is set (resume text is sent to
    # OpenRouter), skipped otherwise.
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemma-3-4b-it}"
    # Observability (see .env.example; empty values fall back to the code defaults).
    LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    LOG_FORMAT: "${LOG_FORMAT:-}"
    APP_ENVIRONMENT: "${APP_ENVIRONMENT:-production}"
    APP_VERSION: "${APP_VERSION:-}"
    METRICS_ALLOWED_IPS: "${METRICS_ALLOWED_IPS:-}"
    OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-}"
    OTEL_PYTHON_DJANGO_EXCLUDED_URLS: "${OTEL_PYTHON_DJANGO_EXCLUDED_URLS:-}"
    SENTRY_DSN: "${SENTRY_DSN:-}"
    SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
    SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-}"
    DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-admin}"
    DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"

x-app-build: &app-build
    context: .
    dockerfile: Dockerfile

x-app-deps: &app-deps
    db:
        condition: service_healthy
    cache:
        condition: service_healthy
    mailhog:
        condition: service_healthy

services:
    web:
        build: *app-build
        container_name: requester_web
        restart: unless-stopped
        command: ["make", "RUN=", "deploy"]
        volumes:
            - .:/app
        ports:
            - "${WEB_PORT:-8000}:8000" # host port; change WEB_PORT if 8000 is taken
        # Per service, not in the image: tasks and scheduler share the image but serve no HTTP.
        # start_period covers the first start (migrations, seeding).
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10m
        environment:
            <<: *app-env
            SERVICE_NAME: "web" # `service` field of every log line
        depends_on: *app-deps

    tasks:
        build: *app-build
        container_name: requester_tasks
        restart: unless-stopped
        command: ["make", "RUN=", "setup_celery"]
        volumes:
            - .:/app
        environment:
            <<: *app-env
            SERVICE_NAME: "tasks" # `service` field of every log line
        depends_on: *app-deps

    scheduler:
        build: *app-build
        container_name: requester_scheduler
        restart: unless-stopped
        command: ["make", "RUN=", "setup_scheduler"]
        volumes:
            - .:/app
        environment:
            <<: *app-env
            SERVICE_NAME: "scheduler" # `service` field of every log line
        depends_on:
            cache:
                condition: service_healthy
            db:
                condition: service_healthy

    mailhog:
        image: mailhog/mailhog:v1.0.1
        container_name: requester_mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        healthcheck:
            # -O /dev/null: a saved index.html made every later check fail ("File exists").
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025 || exit 1"]
            interval: 1m
            timeout: 10s
            retries: 3

    db:
        image: mariadb:11.4
        container_name: requester_db
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: "${DB_NAME:-requester}"
            MARIADB_USER: "${DB_USER:-requester}"
            MARIADB_PASSWORD: "${DB_PASSWORD:-requester-dev-password}"
            MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-requester-dev-root}"
        ports:
            - "3306:3306"
        volumes:
            - ./mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 30s
            timeout: 10s
            retries: 5

    cache:
        image: redis:7.2.4
        container_name: requester_cache
        restart: unless-stopped
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-requester-dev-redis}"]
        ports:
            - "6379:6379"
        volumes:
            - ./redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3
