# Totals of "right now" (open jobs, candidates open to work...), one document per
# UTC day, overwritten every 15 minutes. Query: sql/daily_stats.sql.
input {
  jdbc {
    id => "daily-stats"
    jdbc_driver_library => "/usr/share/logstash/drivers/mariadb-java-client.jar"
    jdbc_driver_class => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    jdbc_user => "${ANALYTICS_DB_USER}"
    jdbc_password => "${ANALYTICS_DB_PASSWORD}"
    # Django stores UTC in MariaDB (USE_TZ).
    jdbc_default_timezone => "UTC"
    # Rows are streamed, not paged: OFFSET paging over a subquery has no stable order.
    jdbc_fetch_size => 1000
    schedule => "*/15 * * * *"
    statement_filepath => "/usr/share/logstash/sql/daily_stats.sql"
    record_last_run => false
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_daily_stats"
  }
}

filter {
  mutate { remove_field => ["@version", "@timestamp"] }
}

output {
  elasticsearch {
    id => "requester-daily-stats"
    hosts => ["${ELASTICSEARCH_URL}"]
    index => "requester-daily-stats"
    document_id => "%{day_id}"
    action => "index"
    data_stream => "false"
    ilm_enabled => false
    # Field types: templates/requester-daily-stats.json, installed on start.
    manage_template => true
    template => "/usr/share/logstash/templates/requester-daily-stats.json"
    template_name => "requester-daily-stats"
    template_api => "composable"
    template_overwrite => true
  }
}
