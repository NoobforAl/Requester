# Application status changes: new ones every minute (they are never edited).
# Query: sql/application_events.sql. See docs/analytics.md.
input {
  jdbc {
    id => "application_events-changes"
    jdbc_driver_library => "/usr/share/logstash/drivers/mariadb-java-client.jar"
    jdbc_driver_class => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    jdbc_user => "${ANALYTICS_DB_USER}"
    jdbc_password => "${ANALYTICS_DB_PASSWORD}"
    # Django stores UTC in MariaDB (USE_TZ).
    jdbc_default_timezone => "UTC"
    # Rows are streamed, not paged: OFFSET paging over a subquery has no stable order.
    jdbc_fetch_size => 1000
    schedule => "* * * * *"
    statement_filepath => "/usr/share/logstash/sql/application_events.sql"
    use_column_value => true
    tracking_column => "created_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_application_events"
  }
}

filter {
  mutate {
    copy => { "id" => "[@metadata][id]" }
  }
  mutate { remove_field => ["@version", "@timestamp"] }
}

output {
  elasticsearch {
    id => "requester-application-events"
    hosts => ["${ELASTICSEARCH_URL}"]
    index => "requester-application-events"
    document_id => "%{[@metadata][id]}"
    action => "index"
    data_stream => "false"
    ilm_enabled => false
    # Field types: templates/requester-application-events.json, installed on start.
    manage_template => true
    template => "/usr/share/logstash/templates/requester-application-events.json"
    template_name => "requester-application-events"
    template_api => "composable"
    template_overwrite => true
  }
}
