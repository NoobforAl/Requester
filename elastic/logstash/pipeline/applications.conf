# Applications (no candidate identity): changed ones every minute, all every night.
# Query: sql/applications.sql. See docs/analytics.md.
input {
  jdbc {
    id => "applications-changes"
    jdbc_driver_library => "/usr/share/logstash/drivers/mariadb-java-client.jar"
    jdbc_driver_class => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    jdbc_user => "${ANALYTICS_DB_USER}"
    jdbc_password => "${ANALYTICS_DB_PASSWORD}"
    # Django stores UTC in MariaDB (USE_TZ).
    jdbc_default_timezone => "UTC"
    # Rows are streamed, not paged: OFFSET paging over a subquery has no stable order.
    jdbc_fetch_size => 1000
    schedule => "* * * * *"
    statement_filepath => "/usr/share/logstash/sql/applications.sql"
    use_column_value => true
    tracking_column => "changed_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_applications"
  }
  jdbc {
    id => "applications-nightly"
    jdbc_driver_library => "/usr/share/logstash/drivers/mariadb-java-client.jar"
    jdbc_driver_class => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    jdbc_user => "${ANALYTICS_DB_USER}"
    jdbc_password => "${ANALYTICS_DB_PASSWORD}"
    # Django stores UTC in MariaDB (USE_TZ).
    jdbc_default_timezone => "UTC"
    # Rows are streamed, not paged: OFFSET paging over a subquery has no stable order.
    jdbc_fetch_size => 1000
    schedule => "0 3 * * *"
    statement_filepath => "/usr/share/logstash/sql/applications.sql"
    # Never remembers a last value, so :sql_last_value is the epoch: every row.
    record_last_run => false
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_applications-nightly"
  }
}

filter {
  # Computed flags arrive as 0/1.
  mutate { convert => { "has_ai_summary" => "boolean" } }
  mutate {
    copy => { "id" => "[@metadata][id]" }
  }
  mutate { remove_field => ["@version", "@timestamp"] }
}

output {
  elasticsearch {
    id => "requester-applications"
    hosts => ["${ELASTICSEARCH_URL}"]
    index => "requester-applications"
    document_id => "%{[@metadata][id]}"
    action => "index"
    data_stream => "false"
    ilm_enabled => false
    # Field types: templates/requester-applications.json, installed on start.
    manage_template => true
    template => "/usr/share/logstash/templates/requester-applications.json"
    template_name => "requester-applications"
    template_api => "composable"
    template_overwrite => true
  }
}
